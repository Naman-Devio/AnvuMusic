# 🚫 Assistant Restricted / Banned
assistant_restricted_warning: |
  ⚠️ <b>असिस्टेंट प्रतिबंधित है</b>

  असिस्टेंट {assistant} (आईडी: <code>{id}</code>) को इस चैट में <b>बैन</b> या प्रतिबंधित कर दिया गया है।
  इसके जारी रहने पर मैं संगीत नहीं बजा सकता, कतार प्रबंधित नहीं कर सकता, या ट्रैक साफ़ नहीं कर सकता।

  <i>सभी संगीत सुविधाओं को पुनर्स्थापित करने के लिए असिस्टेंट से बैन हटाएं 🎵</i>

