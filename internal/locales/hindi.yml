err_connection_timeout: |
  ⚠️ <b>वॉयसचैट कनेक्शन टाइमआउट</b>

  टेलीग्राम इस समय वॉयस चैट कनेक्शन का ठीक से जवाब नहीं दे रहा है।

  यदि यह बार-बार हो रहा है, तो वॉयस चैट को समाप्त करें और इसे फिर से शुरू करें, फिर पुनः प्रयास करें।

err_no_active_voicechat: |
  🎙️ <b>कोई सक्रिय वॉयस चैट नहीं है</b>

  मैं शामिल नहीं हो सकता — कृपया पहले वॉयस चैट शुरू करें।

  क्या पहले ही शुरू कर चुके हैं? रीफ्रेश करने के लिए /reload का उपयोग करें।

