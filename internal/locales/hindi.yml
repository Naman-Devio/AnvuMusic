err_peer_resolve_failed: |
  ⚠️ पीयर जानकारी हल करने में विफल। बाद में पुनः प्रयास करें या असिस्टेंट को फिर से जोड़ें।

err_rtmp_missing_params: |
  <b>⚠️ RTMP विवरण गायब हैं</b>

  ऐसा लगता है कि इस चैट में एक <b>RTMP स्ट्रीम</b> सक्रिय है, लेकिन आपने आवश्यक
  <b>RTMP URL</b> या <b>स्ट्रीम की</b> प्रदान नहीं की है। इनके बिना, मैं RTMP पर संगीत स्ट्रीम करना शुरू नहीं कर सकता।

  <b>उपयोग करें:</b> <code>/setrtmp [chat_id] [url+key]</code>

  📌 एक बार RTMP विवरण सेट हो जाने के बाद, आप स्ट्रीमिंग शुरू कर सकते हैं।  
  ➡️ यदि आप RTMP का उपयोग नहीं करना चाहते हैं, तो इसके बजाय नियमित वॉयस चैट पर स्विच करें।
  
