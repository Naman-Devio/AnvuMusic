# Commands help
help_owner: |
  <blockquote>
  👑 <b>ओनर लेन</b> — सूडो रोस्टर, गो इवल, मेंटेनेंस, रीस्टार्ट, शेल।
  </blockquote>

  <i>फ्लीट प्रशासन के लिए विशेष उपकरण।</i>

  <b>कमांड्स:</b>
  <b>/addsudo</b> - बॉट की सूडो सूची में नया यूजर जोड़ें
  <b>/delsudo</b> - बॉट की सूडो सूची से यूजर हटाएं
  <b>/eval</b> - गो कोड स्निपेट निष्पादित करें
  <b>/maintenance</b> — बॉट के मेंटेनेंस मोड को प्रबंधित करें
  <b>/restart</b> — बॉट को रीस्टार्ट करें
  <b>/sh</b> - शेल कमांड चलाएं

help_sudo: |
  <blockquote>
  ⚡ <b>सूडो लेन</b> — सक्रिय चैट, ऑटो-लीव, लॉगर, आंकड़े, लॉग पुल।
  </blockquote>

  <i>ओनर-ओनली स्विच को छुए बिना टेलीमेट्री और स्वचालन।</i>

  <b>कमांड्स:</b>
  <b>/active</b> - कुल सक्रिय चैट दिखाता है
  <b>/autoleave</b> - स्वचालित चैट छोड़ने की सुविधा टॉगल करें
  <b>/logger</b> - लॉगर सक्षम या अक्षम करें
  <b>/stats</b> - बॉट और सिस्टम आंकड़े प्रदर्शित करें
  <b>/logs</b> - सिस्टम लॉग प्राप्त करें 

help_admin: |
  <blockquote>
  🎛 <b>डीजे · एडमिन डेक</b> — ट्रांसपोर्ट, कतार सर्जरी, लूप, थंब पॉलिसी।
  </blockquote>

  <i>जहाँ आपकी चैट इसे लागू करती है वहाँ एडमिन या ऑथ की आवश्यकता होती है।</i>

  <b>कमांड्स:</b>
  <b>/speed</b> - प्लेबैक गति बदलें
  <b>/skip</b> - वर्तमान गाना छोड़ें
  <b>/pause</b> - वर्तमान प्लेबैक रोकें
  <b>/resume</b> - रुका हुआ प्लेबैक फिर से शुरू करें
  <b>/replay</b> - वर्तमान गाना पुनः चलाएं
  <b>/mute</b> - प्लेबैक म्यूट करें
  <b>/unmute</b> - प्लेबैक अनम्यूट करें
  <b>/seek</b> - कुछ सेकंड आगे बढ़ें
  <b>/seekback</b> - कुछ सेकंड पीछे जाएं
  <b>/jump</b> - ट्रैक में दिए गए समय पर जाएं
  <b>/move</b> - कतारबद्ध ट्रैक को दूसरी स्थिति में ले जाएं
  <b>/clear</b> - कतार से सभी गाने हटाएं
  <b>/remove</b> - कतार से एक विशिष्ट ट्रैक हटाएं
  <b>/shuffle</b> - कतारबद्ध सभी ट्रैक शफल करें
  <b>/loop</b> - लूपिंग सक्षम या अक्षम करें
  <b>/stop</b> - प्लेबैक बंद करें और VC छोड़ें
  <b>/nothumb</b> - प्लेबैक संदेशों में आर्टवर्क/थंबनेल सक्षम या अक्षम करें

help_public: |
  <blockquote>
  🌐 <b>सभी</b> — ट्रैक का अनुरोध करें, कतार पढ़ें, पिंग करें, बग रिपोर्ट करें।
  </blockquote>

  <i>ताज की आवश्यकता नहीं है — जब तक कि आपका समूह नियंत्रण को एडमिन/ऑथ तक सीमित न कर दे।</i>

  <b>कमांड्स:</b>
  <b>/play</b> - एक गाना बजाएं
  <b>/queue</b> - वर्तमान में कतारबद्ध सभी ट्रैक देखें
  <b>/ping</b> - बॉट की नेटवर्क लेटेंसी जांचें
  <b>/start</b> - बॉट शुरू करें
  <b>/help</b> - सहायता मेनू दिखाएं
  <b>/bug</b> - कोई समस्या या त्रुटि रिपोर्ट करें
  <b>/position</b> - वर्तमान ट्रैक का समयास्त (टिमस्टैम्प) दिखाएं
  <b>/reload</b> - एडमिन या कैश डेटा रीलोड करें
  <b>/json</b> - संदेश JSON संरचना दिखाएं
  <b>/sudolist</b> - सूडो यूजर सूची देखें
