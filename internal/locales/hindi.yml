  <code>/setrtmp &lt;chat_id&gt; &lt;full_rtmp_url&gt;</code>
  
  <b>📋 पैरामीटर:</b>
  • <code>chat_id</code> - लक्ष्य चैट/चैनल आईडी
  • <code>full_rtmp_url</code> - स्ट्रीम की के साथ पूर्ण RTMP URL
  
  <b>📝 उदाहरण:</b>
  <code>/setrtmp -1001234567890 rtmps://dc5-1.rtmp.t.me/s/123:key</code>
  
  <b>🔍 चैट आईडी कैसे प्राप्त करें:</b>
  • चैट से कोई भी संदेश @userinfobot पर अग्रेषित (forward) करें
  • या चैट में <code>/id</code> कमांड का उपयोग करें
  
  <b>🔐 सुरक्षा:</b>
  • कॉन्फ़िगरेशन केवल डीएम (निजी चैट) में काम करता है
  • आपको लक्ष्य चैट में एडमिन होना चाहिए
  • क्रेडेंशियल सुरक्षित रूप से संग्रहीत किए जाते हैं

